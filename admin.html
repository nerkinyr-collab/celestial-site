<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Celestial · Панель управления</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05060f;--bg2:#0a0c1a;--card:rgba(255,255,255,.04);--cardh:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09);--txt:#eef0fa;--txt2:#9aa3bd;--txt3:#5c6178;
  --acc:#7c5cff;--acc2:#22d3ee;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;
}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 28px;text-align:center}
#login .logo{font-size:26px;font-weight:800;background:linear-gradient(100deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
#login .sub{color:var(--txt2);font-size:13.5px;margin-bottom:24px}
#login input{width:100%;padding:13px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);outline:none;text-align:center;font-size:15px}
#login input:focus{border-color:var(--acc)}
#login .err{color:var(--bad);font-size:13px;min-height:20px;margin:12px 0}
#login button{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#22d3ee);color:#05060f;font-weight:700;font-size:15px}
#login .hint{color:var(--txt3);font-size:12.5px;margin-top:18px}

/* ---------- app ---------- */
#app{display:none}
header{position:sticky;top:0;z-index:50;background:rgba(5,6,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .row{max-width:1200px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .brand{font-weight:800;font-size:17px;background:linear-gradient(100deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
header .live{color:var(--ok);font-size:12.5px;display:flex;align-items:center;gap:6px}
header .live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
header .btns{display:flex;gap:8px}
header .btns button{padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--txt2);font-size:13px}
header .btns button:hover{color:var(--txt);border-color:var(--acc)}
nav{max-width:1200px;margin:0 auto;padding:0 18px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{padding:9px 16px;border-radius:10px;color:var(--txt2);font-size:14px;white-space:nowrap;border:1px solid transparent}
nav button.act{background:rgba(124,92,255,.14);color:#c4b5fd;border-color:rgba(124,92,255,.35)}
main{max-width:1200px;margin:0 auto;padding:20px 18px 60px}

/* ---------- overview ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.st .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.st .v.ok{color:var(--ok)}.st .v.acc{color:#a78bfa}.st .v.warn{color:var(--warn)}.st .v.bad{color:var(--bad)}
.st .l{color:var(--txt2);font-size:12px;margin-top:3px}
.days{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.days h4{font-size:14px;color:var(--txt2);margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars .b{flex:1;background:linear-gradient(180deg,#7c5cff,#22d3ee);border-radius:6px 6px 2px 2px;min-height:2px;position:relative}
.bars .b span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--txt3);white-space:nowrap}
.bars{margin-bottom:24px}

/* ---------- tables ---------- */
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools input{flex:1;min-width:180px;padding:11px 15px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);outline:none;font-size:14px}
.tools input:focus{border-color:var(--acc)}
.tools .cnt{align-self:center;color:var(--txt3);font-size:13px}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{padding:11px 14px;text-align:left;color:var(--txt2);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(255,255,255,.02)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.025)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:#c4b5fd}
.pill{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:600}
.pill.ok{background:rgba(74,222,128,.13);color:var(--ok)}
.pill.bad{background:rgba(248,113,113,.13);color:var(--bad)}
.pill.warn{background:rgba(251,191,36,.13);color:var(--warn)}
.pill.fresh{background:rgba(34,211,238,.12);color:var(--acc2)}
.pill.inf{background:rgba(167,139,250,.15);color:#c4b5fd}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.ab{padding:5px 11px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;color:var(--txt2);transition:.15s}
.ab:hover{color:var(--txt);border-color:var(--acc)}
.ab.danger:hover{color:var(--bad);border-color:var(--bad)}
.ab.grn:hover{color:var(--ok);border-color:var(--ok)}
.empty{padding:40px;text-align:center;color:var(--txt3);font-size:14px}
.ref-row td{border-bottom:1px solid var(--line)}
.rank{font-size:15px}
.rank b{color:#c4b5fd}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#151830;border:1px solid var(--acc);color:var(--txt);padding:12px 22px;border-radius:12px;font-size:14px;transition:.25s;z-index:200;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.bad{border-color:var(--bad)}

/* ---------- responsive: карточки на мобиле ---------- */
@media(max-width:720px){
  main{padding:14px 12px 50px}
  .tblwrap{overflow-x:auto;border-radius:14px}
  th{position:sticky;top:0;background:#0b0d1c}
  .stats{grid-template-columns:repeat(2,1fr)}
  header .live span{display:none}
}
@media(max-width:480px){
  .stats{grid-template-columns:1fr 1fr}
  .st .v{font-size:19px}
}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="logo">CELESTIAL</div>
    <div class="sub">Панель управления · полный доступ</div>
    <input id="keyInput" type="password" placeholder="Ключ панели" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button id="loginBtn">Войти</button>
    <div class="hint">Ключ задаётся командой /setadminkey в боте</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="row">
      <span class="brand">CELESTIAL · ПАНЕЛЬ</span>
      <span class="live"><i></i><span>онлайн</span></span>
      <div class="btns">
        <button id="refreshBtn">⟳ Обновить</button>
        <button id="logoutBtn">Выйти</button>
      </div>
    </div>
    <nav id="tabs">
      <button data-tab="overview" class="act">📊 Обзор</button>
      <button data-tab="launchers">🖥 Лаунчеры</button>
      <button data-tab="licenses">🔐 Лицензии</button>
      <button data-tab="users">👥 Юзеры</button>
      <button data-tab="refs">🤝 Рефералы</button>
      <button data-tab="sales">💰 Продажи</button>
      <button data-tab="log">📜 Лог</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<div id="toast"></div>

<script>
(function(){
var API = "https://celestial.fertixber1.workers.dev/admin/api/";
var key = localStorage.getItem("cel_admin_key") || "";
var cache = {};
var cur = "overview";

function toast(msg, isBad){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = isBad ? "on bad" : "on";
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.className = ""; }, 2600);
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function api(sub, opts){
  opts = opts || {};
  return fetch(API + sub, {
    method: opts.method || "GET",
    headers: { "X-Admin-Key": key, "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){ return r.json().catch(function(){ return {success:false,message:"bad json"}; }); });
}
function fmtAgo(ts){
  if (!ts || ts === "—") return "—";
  var d = new Date(ts.replace(/(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2})/, "$3-$2-$1T$4:$5"));
  if (isNaN(d)) return ts;
  var s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return "только что";
  if (s < 3600) return Math.floor(s/60) + " мин назад";
  if (s < 86400) return Math.floor(s/3600) + " ч назад";
  return Math.floor(s/86400) + " дн назад";
}

// ---------- login ----------
function tryLogin(k){
  key = k;
  api("overview").then(function(r){
    if (r.success){
      localStorage.setItem("cel_admin_key", key);
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      render();
    } else {
      document.getElementById("loginErr").textContent = r.message || "Ошибка входа";
      key = "";
    }
  }).catch(function(){ document.getElementById("loginErr").textContent = "Сервер недоступен"; });
}
document.getElementById("loginBtn").onclick = function(){ tryLogin(document.getElementById("keyInput").value.trim()); };
document.getElementById("keyInput").addEventListener("keydown", function(e){ if (e.key === "Enter") tryLogin(this.value.trim()); });
if (key) tryLogin(key);
document.getElementById("logoutBtn").onclick = function(){
  localStorage.removeItem("cel_admin_key");
  location.reload();
};
document.getElementById("refreshBtn").onclick = function(){ cache = {}; render(); toast("Обновлено"); };

// ---------- tabs ----------
document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if (!b) return;
  cur = b.dataset.tab;
  this.querySelectorAll("button").forEach(function(x){ x.classList.toggle("act", x === b); });
  render();
});

// ---------- render ----------
function render(){
  var m = document.getElementById("main");
  if (cur === "overview") return renderOverview(m);
  if (cur === "launchers") return renderLaunchers(m);
  if (cur === "licenses") return renderLicenses(m);
  if (cur === "users") return renderUsers(m);
  if (cur === "refs") return renderRefs(m);
  if (cur === "sales") return renderSales(m);
  if (cur === "log") return renderLog(m);
}

function renderOverview(m){
  if (cache.overview){
    var d = cache.overview;
    var max = Math.max.apply(null, d.days.map(function(x){ return x.c; }).concat([1]));
    m.innerHTML =
      '<div class="stats">' +
      st(d.sold, "Продано ключей", "acc") +
      st(d.stars + " ⭐", "Выручка Stars", "ok") +
      st(d.rub.toLocaleString("ru-RU") + " ₽", "Выручка ₽ (ручная)", "ok") +
      st(d.users, "Юзеров в боте", "") +
      st(d.launchers, "Лаунчеров", "") +
      st(d.launchesToday, "Запусков сегодня", "acc") +
      st(d.launchesTotal, "Запусков всего", "") +
      st(d.pendingOrders, "Заказов ждут", d.pendingOrders ? "warn" : "") +
      st(d.referrals, "Рефералов пришло", "acc2") +
      st(d.bannedLaunchers, "Забанено лаунчеров", d.bannedLaunchers ? "bad" : "") +
      st(d.killedLaunchers, "Килл-лист", d.killedLaunchers ? "bad" : "") +
      st(d.refUsers, "Приглашающих", "") +
      '</div>' +
      '<div class="days"><h4>Запуски по дням (последний ' + d.lastLaunch + ')</h4><div class="bars">' +
      d.days.slice().reverse().map(function(x){
        return '<div class="b" style="height:' + Math.max(3, x.c / max * 90) + 'px" title="' + x.d + ': ' + x.c + '"><span>' + x.d.slice(8) + '.' + x.d.slice(5,7) + '</span></div>';
      }).join("") + '</div></div>';
    return;
  }
  m.innerHTML = '<div class="empty">Загрузка…</div>';
  api("overview").then(function(r){
    if (!r.success) return m.innerHTML = '<div class="empty">' + esc(r.message) + '</div>';
    cache.overview = r;
    renderOverview(m);
  });
}
function st(v, l, cls){
  return '<div class="st"><div class="v ' + (cls||"") + '">' + esc(v) + '</div><div class="l">' + l + '</div></div>';
}

// ---------- generic table with search ----------
function scaffold(m, title, searchPlaceholder, cols, rowsHtml){
  m.innerHTML =
    '<div class="tools"><input id="q" placeholder="' + searchPlaceholder + '"><span class="cnt" id="cnt"></span></div>' +
    '<div class="tblwrap"><table><thead><tr>' +
    cols.map(function(c){ return '<th>' + c + '</th>'; }).join("") +
    '</tr></thead><tbody id="tb"></tbody></table></div>';
  document.getElementById("tb").innerHTML = rowsHtml;
  var q = document.getElementById("q");
  q.addEventListener("input", function(){
    var v = this.value.toLowerCase();
    var rows = document.querySelectorAll("#tb tr");
    var n = 0;
    rows.forEach(function(r){
      var show = !v || r.textContent.toLowerCase().indexOf(v) !== -1;
      r.style.display = show ? "" : "none";
      if (show) n++;
    });
    document.getElementById("cnt").textContent = n + " / " + rows.length;
  });
}

function renderLaunchers(m){
  if (!cache.launchers){
    m.innerHTML = '<div class="empty">Загрузка…</div>';
    return api("launchers").then(function(r){
      if (!r.success) return m.innerHTML = '<div class="empty">' + esc(r.message) + '</div>';
      cache.launchers = r; renderLaunchers(m);
    });
  }
  var L = cache.launchers.launchers;
  var rows = L.map(function(x){
    var status = x.banned ? '<span class="pill bad">бан</span> ' : "";
    status += x.killed ? '<span class="pill bad">килл</span> ' : "";
    status += x.hasMsg ? '<span class="pill warn">✉ msg</span>' : "";
    if (!status) status = '<span class="pill ok">ок</span>';
    return '<tr data-id="' + esc(x.id) + '">' +
      '<td class="mono">' + esc(x.id) + '<div style="color:var(--txt3);font-size:11px">hwid …' + esc(x.hwid) + '</div></td>' +
      '<td class="mono">' + esc(x.key) + '<div style="color:var(--txt3);font-size:11px">user ' + esc(x.user) + '</div></td>' +
      '<td><b>' + x.count + '</b></td>' +
      '<td>' + esc(x.lastStr) + '<div style="color:var(--txt3);font-size:11px">' + fmtAgo(x.lastStr) + '</div></td>' +
      '<td>' + status + '</td>' +
      '<td><div class="acts">' +
        (x.banned
          ? '<button class="ab grn" data-act="unban">Разбан</button>'
          : '<button class="ab danger" data-act="ban">Бан</button>') +
        (x.killed
          ? '<button class="ab grn" data-act="unkill">Снять килл</button>'
          : '<button class="ab danger" data-act="kill">💀 Килл</button>') +
        '<button class="ab" data-act="msg">✉ Сообщение</button>' +
      '</div></td></tr>';
  }).join("") || '<tr><td colspan="6" class="empty">Никто ещё не запускал лаунчер</td></tr>';
  scaffold(m, "launchers", "Поиск: ID, ключ, юзер…", ["Лаунчер", "Ключ · юзер", "Запусков", "Последний", "Статус", "Действия"], rows);
  document.getElementById("cnt").textContent = L.length + " шт";
}

function renderLicenses(m){
  if (!cache.licenses){
    m.innerHTML = '<div class="empty">Загрузка…</div>';
    return api("licenses").then(function(r){
      if (!r.success) return m.innerHTML = '<div class="empty">' + esc(r.message) + '</div>';
      cache.licenses = r; renderLicenses(m);
    });
  }
  var L = cache.licenses.licenses;
  var rows = L.map(function(x){
    var pill = x.status === "activated" ? '<span class="pill ok">активен</span>'
      : x.status === "fresh" ? '<span class="pill fresh">не актив.</span>'
      : x.status === "expired" ? '<span class="pill warn">истёк</span>'
      : x.status === "banned" ? '<span class="pill bad">бан</span>'
      : '<span class="pill warn">' + esc(x.status) + '</span>';
    var exp = x.daysLeft === "∞" ? '<span class="pill inf">♾</span>' : esc(x.daysLeft) + ' дн';
    return '<tr data-key="' + esc(x.key) + '">' +
      '<td class="mono">' + esc(x.key) + '</td>' +
      '<td>' + esc(x.plan) + '</td>' +
      '<td>' + pill + '</td>' +
      '<td class="mono">' + esc(x.userId) + '</td>' +
      '<td class="mono">' + (x.hwid ? "…" + esc(x.hwid) : "—") + '</td>' +
      '<td>' + exp + '</td>' +
      '<td style="color:var(--txt2);font-size:12px">' + esc(x.activatedAt) + '</td>' +
      '<td><div class="acts">' +
        '<button class="ab danger" data-act="revoke">🗑 Снос</button>' +
        '<button class="ab grn" data-act="resethwid">🔄 HWID</button>' +
        (x.status === "banned"
          ? '<button class="ab grn" data-act="unban">Разбан</button>'
          : '<button class="ab danger" data-act="ban">🚫 Бан</button>') +
      '</div></td></tr>';
  }).join("") || '<tr><td colspan="8" class="empty">Лицензий нет</td></tr>';
  scaffold(m, "licenses", "Поиск: ключ, юзер, план…", ["Ключ", "План", "Статус", "Юзер", "HWID", "Осталось", "Активирован", "Действия"], rows);
  document.getElementById("cnt").textContent = L.length + " ключей";
}

function renderUsers(m){
  if (!cache.users){
    m.innerHTML = '<div class="empty">Загрузка…</div>';
    return api("users").then(function(r){
      if (!r.success) return m.innerHTML = '<div class="empty">' + esc(r.message) + '</div>';
      cache.users = r; renderUsers(m);
    });
  }
  var U = cache.users.users;
  var rows = U.map(function(u){
    var pill = u.banned ? '<span class="pill bad">бан</span>' : '<span class="pill ok">ок</span>';
    return '<tr data-id="' + u.id + '">' +
      '<td><b>' + esc(u.name || "—") + '</b>' + (u.username ? ' <span style="color:var(--txt3)">@' + esc(u.username) + '</span>' : '') + '<div class="mono">' + u.id + '</div></td>' +
      '<td>' + pill + '</td>' +
      '<td>' + (u.purchases ? '<b>' + u.purchases + '</b>' : "—") + '</td>' +
      '<td>' + (u.refCount ? '<b style="color:#a78bfa">' + u.refCount + '</b>' : "—") + (u.refBy ? '<div style="color:var(--txt3);font-size:11px">от ' + esc(u.refBy) + '</div>' : '') + '</td>' +
      '<td style="color:var(--txt2);font-size:12px">' + esc(u.firstSeen) + '</td>' +
      '<td><div class="acts">' +
        (u.banned
          ? '<button class="ab grn" data-act="unban">Разбан</button>'
          : '<button class="ab danger" data-act="ban">Бан</button>') +
      '</div></td></tr>';
  }).join("") || '<tr><td colspan="6" class="empty">Юзеров нет</td></tr>';
  scaffold(m, "users", "Поиск: имя, @username, ID…", ["Юзер", "Статус", "Ключей", "Пригласил", "Первый вход", "Действия"], rows);
  document.getElementById("cnt").textContent = U.length + " юзеров";
}

function renderRefs(m){
  if (!cache.users){
    m.innerHTML = '<div class="empty">Загрузка…</div>';
    return api("users").then(function(r){
      if (!r.success) return m.innerHTML = '<div class="empty">' + esc(r.message) + '</div>';
      cache.users = r; renderRefs(m);
    });
  }
  var U = cache.users.users.filter(function(u){ return u.refCount > 0; });
  var total = cache.users.users.reduce(function(a, u){ return a + u.refCount; }, 0);
  var byRef = {};
  cache.users.users.forEach(function(u){ if (u.refByRaw != null) {} });
  // карта приглашённых: id реферера -> список юзеров
  var invited = {};
  cache.users.users.forEach(function(u){
    if (u.refBy){ /* ник в тексте, отдельно id нет — считаем по refCount сверху */ }
  });
  var medals = ["🥇", "🥈", "🥉"];
  var rows = U.map(function(u, i){
    return '<tr class="ref-row">' +
      '<td class="rank">' + (medals[i] || (i+1) + ".") + '</td>' +
      '<td><b>' + esc(u.name || "—") + '</b>' + (u.username ? ' <span style="color:var(--txt3)">@' + esc(u.username) + '</span>' : '') + '<div class="mono">' + u.id + '</div></td>' +
      '<td><b style="color:#a78bfa;font-size:16px">' + u.refCount + '</b> ' + (u.refCount === 1 ? "человек" : "человек") + '</td>' +
      '<td style="color:var(--txt2);font-size:12px">' + (u.purchases ? "купил ×" + u.purchases : "без покупок") + '</td></tr>';
  }).join("") || '<tr><td colspan="4" class="empty">Пока никто никого не пригласил</td></tr>';
  scaffold(m, "refs", "Поиск: имя, ID…", ["#", "Приглашающий", "Пригласил", "Статус покупок"], rows);
  document.getElementById("cnt").textContent = "Всего приглашено: " + total;
}

function renderSales(m){
  if (!cache.sales){
    m.innerHTML = '<div class="empty">Загрузка…</div>';
    return api("sales").then(function(r){
      if (!r.success) return m.innerHTML = '<div class="empty">' + esc(r.message) + '</div>';
      cache.sales = r; renderSales(m);
    });
  }
  var S = cache.sales.sales;
  var rows = S.map(function(s){
    var method = s.method === "stars" ? "⭐ Stars" : s.method === "sbp" ? "🏦 СБП" : s.method === "crypto" ? "₿ крипта" : esc(s.method);
    return '<tr>' +
      '<td class="mono">' + esc(s.key) + '</td>' +
      '<td>' + esc(s.plan) + '</td>' +
      '<td class="mono">' + esc(s.user) + '</td>' +
      '<td>' + method + '</td>' +
      '<td><b>' + esc(s.amount) + '</b></td>' +
      '<td style="color:var(--txt2);font-size:12px">' + esc(s.ts) + '</td></tr>';
  }).join("") || '<tr><td colspan="6" class="empty">Продаж пока нет</td></tr>';
  scaffold(m, "sales", "Поиск: ключ, юзер…", ["Ключ", "План", "Юзер", "Метод", "Сумма", "Дата"], rows);
  document.getElementById("cnt").textContent = S.length + " продаж";
}

function renderLog(m){
  if (!cache.log){
    m.innerHTML = '<div class="empty">Загрузка…</div>';
    return api("log").then(function(r){
      if (!r.success) return m.innerHTML = '<div class="empty">' + esc(r.message) + '</div>';
      cache.log = r; renderLog(m);
    });
  }
  var L = cache.log.log;
  var rows = L.map(function(e){
    return '<tr>' +
      '<td style="color:var(--txt2);font-size:12px;white-space:nowrap">' + esc(e.t) + '</td>' +
      '<td class="mono">' + esc(e.key) + '</td>' +
      '<td class="mono">' + esc(e.lid || "—") + '</td>' +
      '<td>' + esc(e.plan || "—") + '</td></tr>';
  }).join("") || '<tr><td colspan="4" class="empty">Лог пуст</td></tr>';
  scaffold(m, "log", "Поиск: ключ, лаунчер…", ["Время", "Ключ", "Лаунчер", "План"], rows);
  document.getElementById("cnt").textContent = L.length + " записей";
}

// ---------- действия (event delegation) ----------
document.getElementById("main").addEventListener("click", function(e){
  var b = e.target.closest(".ab");
  if (!b) return;
  var tr = b.closest("tr");
  var act = b.dataset.act;
  if (!tr) return;

  if (b.closest("tr[data-id]") && tr.dataset.id && /ban$|unban$|^kill$|^unkill$|^msg$/.test(act + "")) {
    // лаунчер ИЛИ юзер: определяем по активной вкладке
    if (cur === "launchers") return launcherAction(tr.dataset.id, act);
    if (cur === "users") return userAction(tr.dataset.id, act);
  }
  if (tr.dataset.key && cur === "licenses") return licenseAction(tr.dataset.key, act);
});

function launcherAction(id, act){
  if (act === "msg"){
    var text = prompt("Сообщение для владельца лаунчера " + id + " (увидит при следующем входе):");
    if (!text) return;
    return doAction("launcher_action", { action: "msg", id: id, text: text }, "launchers");
  }
  var sure = act === "kill" ? confirm("Убить лаунчер " + id + " при следующем запуске?") : true;
  if (!sure) return;
  doAction("launcher_action", { action: act, id: id }, "launchers");
}
function licenseAction(keyL, act){
  if (act === "revoke"){
    if (!confirm("ПОЛНОСТЬЮ удалить ключ " + keyL + "?\nКлюч перестанет существовать: лицензия + статистика + ключи у юзера.")) return;
  }
  doAction("license_action", { action: act, key: keyL }, "licenses");
}
function userAction(id, act){
  if (act === "ban" && !confirm("Забанить юзера " + id + " в боте?")) return;
  doAction("user_action", { action: act, id: id }, "users");
}

function doAction(endpoint, body, invalidate){
  api(endpoint, { method: "POST", body: body }).then(function(r){
    toast(r.success ? (body.action === "msg" ? "Сообщение поставлено в очередь" : "Готово: " + body.action) : (r.message || "Ошибка"), !r.success);
    if (r.success){
      delete cache[invalidate];
      delete cache.overview;
      render();
    }
  }).catch(function(){ toast("Сервер недоступен", true); });
}

// автообновление обзора каждые 30 сек
setInterval(function(){
  if (document.getElementById("app").style.display !== "none"){
    delete cache.overview;
    if (cur === "overview") render();
  }
}, 30000);
})();
</script>
