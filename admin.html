<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Celestial · Панель управления</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05060f;--bg2:#0a0c1a;--card:rgba(255,255,255,.04);--cardh:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09);--txt:#eef0fa;--txt2:#9aa3bd;--txt3:#5c6178;
  --acc:#7c5cff;--acc2:#22d3ee;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;
}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 28px;text-align:center}
#login .logo{font-size:26px;font-weight:800;background:linear-gradient(100deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
#login .sub{color:var(--txt2);font-size:13.5px;margin-bottom:24px}
#login input{width:100%;padding:13px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);outline:none;text-align:center;font-size:15px}
#login input:focus{border-color:var(--acc)}
#login .err{color:var(--bad);font-size:13px;min-height:20px;margin:12px 0}
#login button{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#22d3ee);color:#05060f;font-weight:700;font-size:15px}
#login .hint{color:var(--txt3);font-size:12.5px;margin-top:18px}

/* ---------- app ---------- */
#app{display:none}
header{position:sticky;top:0;z-index:50;background:rgba(5,6,15,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .row{max-width:1200px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .brand{font-weight:800;font-size:17px;background:linear-gradient(100deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
header .live{color:var(--ok);font-size:12.5px;display:flex;align-items:center;gap:6px}
header .live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
header .btns{display:flex;gap:8px}
header .btns button{padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--txt2);font-size:13px}
header .btns button:hover{color:var(--txt);border-color:var(--acc)}
nav{max-width:1200px;margin:0 auto;padding:0 18px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{padding:9px 16px;border-radius:10px;color:var(--txt2);font-size:14px;white-space:nowrap;border:1px solid transparent}
nav button.act{background:rgba(124,92,255,.14);color:#c4b5fd;border-color:rgba(124,92,255,.35)}
main{max-width:1200px;margin:0 auto;padding:20px 18px 80px}

/* ---------- overview ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.st .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.st .v.ok{color:var(--ok)}.st .v.acc{color:#a78bfa}.st .v.warn{color:var(--warn)}.st .v.bad{color:var(--bad)}
.st .l{color:var(--txt2);font-size:12px;margin-top:3px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.panel h4{font-size:13px;color:var(--txt2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{white-space:nowrap}
.feed{display:flex;flex-direction:column;gap:2px}
.feed .ev{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.feed .ev:last-child{border-bottom:0}
.feed .ev .ic{font-size:15px}
.feed .ev .tx{flex:1;color:var(--txt2);word-break:break-word}
.feed .ev .tm{color:var(--txt3);font-size:11px;white-space:nowrap}
.days .bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-bottom:24px}
.bars .b{flex:1;background:linear-gradient(180deg,#7c5cff,#22d3ee);border-radius:6px 6px 2px 2px;min-height:2px;position:relative}
.bars .b span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--txt3);white-space:nowrap}

/* ---------- tables ---------- */
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tools input{flex:1;min-width:170px;padding:11px 15px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);outline:none;font-size:14px}
.tools input:focus{border-color:var(--acc)}
.tools .cnt{color:var(--txt3);font-size:13px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fc{padding:7px 13px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--txt2);font-size:12.5px}
.fc.act{background:rgba(124,92,255,.15);color:#c4b5fd;border-color:rgba(124,92,255,.4)}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{padding:11px 14px;text-align:left;color:var(--txt2);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(255,255,255,.02)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:not(.norec):hover{background:rgba(255,255,255,.03);cursor:pointer}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:#c4b5fd}
.sub2{color:var(--txt3);font-size:11px}
.pill{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:600}
.pill.ok{background:rgba(74,222,128,.13);color:var(--ok)}
.pill.bad{background:rgba(248,113,113,.13);color:var(--bad)}
.pill.warn{background:rgba(251,191,36,.13);color:var(--warn)}
.pill.fresh{background:rgba(34,211,238,.12);color:var(--acc2)}
.pill.inf{background:rgba(167,139,250,.15);color:#c4b5fd}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.ab{padding:5px 11px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;color:var(--txt2);transition:.15s}
.ab:hover{color:var(--txt);border-color:var(--acc)}
.ab.danger:hover{color:var(--bad);border-color:var(--bad)}
.ab.grn:hover{color:var(--ok);border-color:var(--ok)}
.empty{padding:40px;text-align:center;color:var(--txt3);font-size:14px}
.rank{font-size:15px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:300;display:none}
#modal.on{display:flex;align-items:flex-start;justify-content:center}
#modal .bg{position:absolute;inset:0;background:rgba(2,3,10,.75);backdrop-filter:blur(4px)}
#modal .win{position:relative;width:100%;max-width:640px;margin:40px 16px;background:#0b0d1c;border:1px solid rgba(124,92,255,.35);border-radius:18px;max-height:calc(100vh - 80px);overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.6)}
#modal .mhead{position:sticky;top:0;background:#0b0d1c;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
#modal .mhead .mt{font-weight:700;font-size:16px}
#modal .mhead .x{padding:6px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--txt2);font-size:18px;line-height:1}
#modal .mbody{padding:20px 22px}
.mrow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.mrow .mk{color:var(--txt2);white-space:nowrap}
.mrow .mv{text-align:right;word-break:break-all}
.msec{margin:18px 0 8px;font-size:12px;color:var(--acc2);text-transform:uppercase;letter-spacing:.08em}
.mact{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.mact .ab{padding:9px 16px;font-size:13px}
.listi{padding:8px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.listi .nm{font-weight:600}
.listi .meta{color:var(--txt3);font-size:11.5px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#151830;border:1px solid var(--acc);color:var(--txt);padding:12px 22px;border-radius:12px;font-size:14px;transition:.25s;z-index:400;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.bad{border-color:var(--bad)}

@media(max-width:860px){.cols{grid-template-columns:1fr}}
@media(max-width:720px){
  main{padding:14px 12px 60px}
  .tblwrap{overflow-x:auto;border-radius:14px}
  th{position:sticky;top:0;background:#0b0d1c}
  .stats{grid-template-columns:repeat(2,1fr)}
  header .live span{display:none}
  #modal .win{margin:12px 8px;max-height:calc(100vh - 24px)}
}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.st .v{font-size:19px}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="logo">CELESTIAL</div>
    <div class="sub">Панель управления · полный доступ</div>
    <input id="keyInput" type="password" placeholder="Ключ панели" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button id="loginBtn">Войти</button>
    <div class="hint">Ключ задаётся командой /setadminkey в боте</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="row">
      <span class="brand">CELESTIAL · ПАНЕЛЬ</span>
      <span class="live"><i></i><span>онлайн</span></span>
      <div class="btns">
        <button id="refreshBtn">⟳ Обновить</button>
        <button id="logoutBtn">Выйти</button>
      </div>
    </div>
    <nav id="tabs">
      <button data-tab="overview" class="act">📊 Обзор</button>
      <button data-tab="launchers">🖥 Лаунчеры</button>
      <button data-tab="licenses">🔐 Лицензии</button>
      <button data-tab="users">👥 Юзеры</button>
      <button data-tab="refs">🤝 Рефералы</button>
      <button data-tab="sales">💰 Продажи</button>
      <button data-tab="log">📜 Лог</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<div id="modal"><div class="bg"></div><div class="win">
  <div class="mhead"><span class="mt" id="mTitle"></span><button class="x" id="mClose">×</button></div>
  <div class="mbody" id="mBody"></div>
</div></div>

<div id="toast"></div>

<script>
(function(){
var API = "https://celestial.fertixber1.workers.dev/admin/api/";
var key = localStorage.getItem("cel_admin_key") || "";
var cache = {};
var cur = "overview";
var licFilter = "all";

function toast(msg, isBad){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = isBad ? "on bad" : "on";
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.className = ""; }, 2800);
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function api(sub, opts){
  opts = opts || {};
  return fetch(API + sub, {
    method: opts.method || "GET",
    headers: { "X-Admin-Key": key, "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){ return r.json().catch(function(){ return {success:false,message:"bad json"}; }); });
}
function ago(ts){
  if (!ts || ts === "—") return "";
  var m = String(ts).match(/^(\d{2})\.(\d{2})\.(\d{4}),? (\d{2}):(\d{2})/);
  var d = m ? new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]) : new Date(ts);
  if (isNaN(d.getTime())) return "";
  var s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) s = 0;
  if (s < 60) return "только что";
  if (s < 3600) return Math.floor(s/60) + " мин назад";
  if (s < 86400) return Math.floor(s/3600) + " ч назад";
  return Math.floor(s/86400) + " дн назад";
}

// ---------- login ----------
function tryLogin(k){
  key = k;
  api("overview").then(function(r){
    if (r.success){
      localStorage.setItem("cel_admin_key", key);
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      render();
    } else {
      document.getElementById("loginErr").textContent = r.message || "Ошибка входа";
      key = "";
    }
  }).catch(function(){ document.getElementById("loginErr").textContent = "Сервер недоступен"; });
}
document.getElementById("loginBtn").onclick = function(){ tryLogin(document.getElementById("keyInput").value.trim()); };
document.getElementById("keyInput").addEventListener("keydown", function(e){ if (e.key === "Enter") tryLogin(this.value.trim()); });
if (key) tryLogin(key);
document.getElementById("logoutBtn").onclick = function(){ localStorage.removeItem("cel_admin_key"); location.reload(); };
document.getElementById("refreshBtn").onclick = function(){ cache = {}; render(); toast("Обновлено"); };

// ---------- tabs ----------
document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if (!b) return;
  cur = b.dataset.tab;
  this.querySelectorAll("button").forEach(function(x){ x.classList.toggle("act", x === b); });
  render();
});

// ---------- modal ----------
function openModal(title, html){
  document.getElementById("mTitle").innerHTML = title;
  document.getElementById("mBody").innerHTML = html;
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }
document.getElementById("mClose").onclick = closeModal;
document.querySelector("#modal .bg").onclick = closeModal;
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeModal(); });

function mrow(k, v){ return '<div class="mrow"><span class="mk">' + k + '</span><span class="mv">' + v + '</span></div>'; }

// ---------- render ----------
function render(){
  var m = document.getElementById("main");
  if (cur === "overview") return renderOverview(m);
  if (cur === "launchers") return renderLaunchers(m);
  if (cur === "licenses") return renderLicenses(m);
  if (cur === "users") return renderUsers(m);
  if (cur === "refs") return renderRefs(m);
  if (cur === "sales") return renderSales(m);
  if (cur === "log") return renderLog(m);
}

function renderOverview(m){
  if (cache.overview){
    var d = cache.overview;
    var max = Math.max.apply(null, d.days.map(function(x){ return x.c; }).concat([1]));
    var methodNames = { stars: "⭐ Stars", sbp: "🏦 СБП", crypto: "₿ Крипта", manual: "✋ Вручную", sim: "🧪 Сим" };
    m.innerHTML =
      '<div class="stats">' +
      st(d.sold, "Продано ключей", "acc") +
      st(d.activeSubs, "Активных подписок", "ok") +
      st(d.expiringSoon, "Истекают ≤3 дн", d.expiringSoon ? "warn" : "") +
      st(d.stars + " ⭐", "Выручка Stars", "ok") +
      st(d.rub.toLocaleString("ru-RU") + " ₽", "Выручка ₽", "ok") +
      st(d.users, "Юзеров в боте", "") +
      st(d.launchers, "Лаунчеров", "") +
      st(d.launchesToday, "Запусков сегодня", "acc") +
      st(d.launchesTotal, "Запусков всего", "") +
      st(d.pendingOrders, "Заказов ждут", d.pendingOrders ? "warn" : "") +
      st(d.referrals, "Рефералов пришло", "acc") +
      st(d.refUsers, "Приглашающих", "") +
      st(d.bannedLaunchers, "Банов лаунчеров", d.bannedLaunchers ? "bad" : "") +
      st(d.killedLaunchers, "Килл-лист", d.killedLaunchers ? "bad" : "") +
      '</div>' +
      '<div class="cols">' +
        '<div class="panel"><h4>Выручка по методам</h4>' +
          Object.keys(d.methodDist).map(function(k){
            var v = d.methodDist[k];
            return '<div class="kv"><span>' + (methodNames[k] || esc(k)) + ' · ' + v.count + ' шт</span><b>' + (k === "stars" ? v.amount + " ⭐" : v.amount.toLocaleString("ru-RU") + " ₽") + '</b></div>';
          }).join("") || '<div class="empty">Нет продаж</div>' +
        '</div>' +
        '<div class="panel"><h4>Ключи по тарифам</h4>' +
          Object.keys(d.planDist).map(function(k){
            return '<div class="kv"><span>' + esc(k) + '</span><b>' + d.planDist[k] + '</b></div>';
          }).join("") || '<div class="empty">Нет ключей</div>' +
        '</div>' +
      '</div>' +
      '<div class="cols">' +
        '<div class="panel"><h4>Последние события</h4><div class="feed">' +
          d.events.map(function(e){
            var ic = e.type === "sale" ? "💰" : e.type === "launch" ? "🚀" : "👤";
            return '<div class="ev"><span class="ic">' + ic + '</span><span class="tx">' + esc(e.text) + '</span><span class="tm">' + esc(e.tStr) + '</span></div>';
          }).join("") || '<div class="empty">Событий нет</div>' +
        '</div></div>' +
        '<div class="panel days"><h4>Запуски по дням · последний: ' + esc(d.lastLaunch) + '</h4><div class="bars">' +
          d.days.slice().reverse().map(function(x){
            return '<div class="b" style="height:' + Math.max(3, x.c / max * 90) + 'px" title="' + x.d + ': ' + x.c + '"><span>' + x.d.slice(8) + '.' + x.d.slice(5,7) + '</span></div>';
          }).join("") + '</div></div>' +
      '</div>';
    return;
  }
  m.innerHTML = '<div class="empty">Загрузка…</div>';
  api("overview").then(function(r){
    if (!r.success) return m.innerHTML = '<div class="empty">' + esc(r.message) + '</div>';
    cache.overview = r;
    renderOverview(m);
  });
}
function st(v, l, cls){
  return '<div class="st"><div class="v ' + (cls||"") + '">' + esc(v) + '</div><div class="l">' + l + '</div></div>';
}

// ---------- generic table ----------
function scaffold(m, placeholder, cols, rowsHtml, filterChips){
  var chips = filterChips ? '<div class="fchips">' + filterChips.map(function(c){
    return '<button class="fc' + (c.act ? " act" : "") + '" data-fc="' + c.id + '">' + c.label + '</button>';
  }).join("") + '</div>' : "";
  m.innerHTML =
    '<div class="tools">' + chips + '<input id="q" placeholder="' + placeholder + '"><span class="cnt" id="cnt"></span></div>' +
    '<div class="tblwrap"><table><thead><tr>' +
    cols.map(function(c){ return '<th>' + c + '</th>'; }).join("") +
    '</tr></thead><tbody id="tb"></tbody></table></div>';
  document.getElementById("tb").innerHTML = rowsHtml;
  var q = document.getElementById("q");
  q.addEventListener("input", applyFilter);
  applyFilter();
  function applyFilter(){
    var v = q.value.toLowerCase();
    var rows = document.querySelectorAll("#tb tr");
    var n = 0;
    rows.forEach(function(r){
      var show = (!v || r.textContent.toLowerCase().indexOf(v) !== -1) && (!r.dataset.f || r.dataset.f === licFilter || licFilter === "all");
      r.style.display = show ? "" : "none";
      if (show) n++;
    });
    document.getElementById("cnt").textContent = n + " / " + rows.length;
  }
}
document.getElementById("main").addEventListener("click", function(e){
  var fc = e.target.closest(".fc");
  if (fc){
    licFilter = fc.dataset.fc;
    fc.parentElement.querySelectorAll(".fc").forEach(function(x){ x.classList.toggle("act", x === fc); });
    var q = document.getElementById("q");
    if (q){ q.value = ""; q.dispatchEvent(new Event("input")); }
    return;
  }
});

// ---------- launchers ----------
function renderLaunchers(m){
  if (!cache.launchers){
    m.innerHTML = '<div class="empty">Загрузка…</div>';
    return api("launchers").then(function(r){
      if (!r.success) return m.innerHTML = '<div class="empty">' + esc(r.message) + '</div>';
      cache.launchers = r; renderLaunchers(m);
    });
  }
  var L = cache.launchers.launchers;
  var rows = L.map(function(x){
    var status = x.banned ? '<span class="pill bad">бан</span> ' : "";
    status += x.killed ? '<span class="pill bad">килл</span> ' : "";
    status += x.hasMsg ? '<span class="pill warn">✉ msg</span>' : "";
    if (!status) status = '<span class="pill ok">ок</span>';
    return '<tr data-id="' + esc(x.id) + '" class="row-launcher">' +
      '<td class="mono">' + esc(x.id) + '<div class="sub2">hwid …' + esc(x.hwid) + '</div></td>' +
      '<td class="mono">' + esc(x.key) + '<div class="sub2">user ' + esc(x.user) + '</div></td>' +

// ---------- row clicks → detail ----------
document.getElementById("main").addEventListener("click", function(e){
  // действия из таблиц
  var b = e.target.closest(".ab");
  if (b){
    var tr = b.closest("tr");
    var act = b.dataset.act;
    if (tr && tr.dataset.id && (cur === "launchers")) return tableAction("launcher_action", act, tr.dataset.id);
    if (tr && tr.dataset.id && cur === "users") return tableAction("user_action", act, tr.dataset.id);
    if (tr && tr.dataset.key && cur === "licenses") return tableAction("license_action", act, tr.dataset.key);
  }
  // строки → профили
  var rl = e.target.closest("tr.row-launcher");
  if (rl) return launcherDetail(rl.dataset.id);
  var ru = e.target.closest("tr.row-user");
  if (ru) return userDetail(ru.dataset.id);
  var rk = e.target.closest("tr.row-license");
  if (rk) return licenseDetail(rk.dataset.key);
});

// действия внутри модалки
document.getElementById("mBody").addEventListener("click", function(e){
  var b = e.target.closest("[data-ma]");
  if (!b) return;
  var act = b.dataset.ma;
  var id = b.dataset.id;
  if (act === "msg"){
    var text = prompt("Сообщение для владельца лаунчера (увидит при следующем входе):");
    if (!text) return;
    return doAction("launcher_action", { action: "msg", id: id, text: text }, "launchers");
  }
  if (act === "msguser"){
    var t2 = prompt("Текст сообщения юзеру в Telegram:");
    if (!t2) return;
    return doAction("user_action", { action: "msg", id: id, text: t2 }, "users");
  }
  if (act === "userban" || act === "userunban"){
    if (act === "userban" && !confirm("Забанить юзера в боте?")) return;
    return doAction("user_action", { action: act === "userban" ? "ban" : "unban", id: id }, "users");
  }
  // launcher: ban/unban/kill/unkill | license: revoke/resethwid/ban/unban
  if (["ban","unban","kill","unkill"].indexOf(act) !== -1) return doAction("launcher_action", { action: act, id: id }, "launchers");
  if (["revoke","resethwid"].indexOf(act) !== -1) return doAction("license_action", { action: act, key: id }, "licenses");
  if (act === "license-ban" || act === "license-unban") return doAction("license_action", { action: act.replace("license-",""), key: id }, "licenses");
});

function tableAction(endpoint, act, id){
  if (act === "msg"){
    var text = prompt("Сообщение для владельца (увидит при следующем входе):");
    if (!text) return;
    return doAction("launcher_action", { action: "msg", id: id, text: text }, "launchers");
  }
  if (act === "revoke"){
    if (!confirm("ПОЛНОСТЬЮ удалить ключ " + id + "?\nЛицензия + статистика + ключи у юзера.")) return;
  }
  if (act === "kill" && !confirm("Убить лаунчер при следующем запуске?")) return;
  if (act === "ban" && !confirm("Забанить?")) return;
  var body = endpoint === "license_action" ? { action: act, key: id } : { action: act, id: id };
  doAction(endpoint, body, endpoint === "license_action" ? "licenses" : (cur === "users" ? "users" : "launchers"));
}

function doAction(endpoint, body, invalidate){
  api(endpoint, { method: "POST", body: body }).then(function(r){
    toast(r.success ? "✓ Готово: " + body.action : (r.message || "Ошибка"), !r.success);
    if (r.success){
      delete cache[invalidate];
      delete cache.overview;
      delete cache.refs;
      closeModal();
      render();
    }
  }).catch(function(){ toast("Сервер недоступен", true); });
}

// автообновление обзора каждые 30 сек
setInterval(function(){
  if (document.getElementById("app").style.display !== "none"){
    delete cache.overview;
    if (cur === "overview") render();
  }
}, 30000);
})();
